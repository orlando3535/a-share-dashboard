name: auto-market-data

on:
  schedule:
      # Beijing 09:00-16:00 hourly = UTC 01:00-08:00, Mon-Fri
          - cron: '0 1-8 * * 1-5'
            workflow_dispatch:

            permissions:
              contents: write

              jobs:
                market:
                    runs-on: ubuntu-latest
                        steps:
                              - uses: actions/checkout@v4

                                    - uses: actions/setup-python@v5
                                            with:
                                                      python-version: '3.11'

                                                            - name: Fetch market snapshot
                                                                    run: python scripts/fetch_market.py

                                                                          - name: Commit and push live_data.js
                                                                                  run: |
                                                                                            git config user.name "github-actions[bot]"
                                                                                                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                                                                                                                git add live_data.js
                                                                                                                          if ! git diff --cached --quiet; then
                                                                                                                                      git commit -m "chore: auto market data $(TZ=Asia/Shanghai date '+%F %H:%M')"
                                                                                                                                                  git push
                                                                                                                                                            else
                                                                                                                                                                        echo "no change to live_data.js"
                                                                                                                                                                                  fi
                                                                                                                                                                                  
